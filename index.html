<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071c35">
<title>Hải Vực Huyền Thoại</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071c35;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
#top{height:76px;padding:7px 10px;background:#102c49;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
#title{font-weight:bold;font-size:16px;color:#ffd875}
#stats{line-height:1.7}
#game{display:block;width:100%;height:calc(100dvh - 76px - 150px);min-height:200px}
#controls{height:150px;background:#102c49;display:flex;align-items:center;justify-content:space-around;padding:6px;gap:5px}
button{border:2px solid #7ca3c5;border-radius:15px;background:#234767;color:white;font-weight:bold;touch-action:none}
.pad{width:53px;height:48px;font-size:22px}
.action{width:67px;height:63px;font-size:12px;background:#8b3a29}
#skill{background:#7942a5}
#dash{background:#167a86}
#message{position:absolute;left:50%;top:90px;transform:translateX(-50%);background:#06172be8;padding:8px 13px;border-radius:12px;text-align:center;font-size:13px;pointer-events:none;max-width:90%}
</style>
</head>
<body>
<div id="top">
 <div><div id="title">🏴‍☠️ HẢI VỰC HUYỀN THOẠI</div><div id="quest">Nhiệm vụ: Đánh bại 3 hải tặc</div></div>
 <div id="stats">Lv. 1<br>❤️ 100/100<br>🪙 0</div>
</div>
<canvas id="game"></canvas>
<div id="message">Chào nhà thám hiểm! Hãy đánh bại hải tặc!</div>
<div id="controls">
 <div>
  <div style="text-align:center"><button class="pad" data-key="up">▲</button></div>
  <button class="pad" data-key="left">◀</button>
  <button class="pad" data-key="down">▼</button>
  <button class="pad" data-key="right">▶</button>
 </div>
 <button class="action" id="attack">⚔️<br>ĐÁNH</button>
 <button class="action" id="skill">🔥<br>HỎA TÂM</button>
 <button class="action" id="dash">💨<br>LƯỚT</button>
</div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const stats=document.getElementById("stats"),quest=document.getElementById("quest");
const message=document.getElementById("message");
let W=0,H=0,worldW=1300,worldH=1000,cameraX=0,cameraY=0;
function resize(){
 const r=c.getBoundingClientRect();
 c.width=Math.max(1,Math.floor(r.width*devicePixelRatio));
 c.height=Math.max(1,Math.floor(r.height*devicePixelRatio));
 W=r.width;H=r.height;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize",resize);resize();

const player={x:650,y:500,r:15,hp:100,maxHp:100,lv:1,exp:0,gold:0,dirX:1,dirY:0,hit:0};
let enemies=[];
let defeated=0;
const keys={};
let lastMessage=0;

function say(s){
 message.textContent=s;
 message.style.display="block";
 lastMessage=performance.now();
}
function spawnEnemy(x,y){
 enemies.push({x,y,r:14,hp:50,maxHp:50,speed:38,hit:0,alive:true});
}
spawnEnemy(760,490);spawnEnemy(810,560);spawnEnemy(540,400);
spawnEnemy(380,650);spawnEnemy(900,700);

document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});
 for(const ev of ["pointerup","pointercancel","lostpointercapture"])
  b.addEventListener(ev,()=>keys[k]=false);
});

function movePlayer(dt){
 let x=(keys.right?1:0)-(keys.left?1:0);
 let y=(keys.down?1:0)-(keys.up?1:0);
 const len=Math.hypot(x,y)||1;
 if(x||y){
  x/=len;y/=len;
  player.x+=x*190*dt;player.y+=y*190*dt;
  player.dirX=x;player.dirY=y;
 }
 player.x=Math.max(35,Math.min(worldW-35,player.x));
 player.y=Math.max(35,Math.min(worldH-35,player.y));
}

function attack(){
 let targets=enemies.filter(e=>e.alive&&Math.hypot(e.x-player.x,e.y-player.y)<65);
 if(!targets.length){say("Không có kẻ địch ở gần!");return}
 targets.sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y));
 damage(targets[0],25);
 player.hit=.15;
}
function damage(e,n){
 e.hp-=n;e.hit=.18;
 if(e.hp<=0){
  e.alive=false;defeated++;player.gold+=25;player.exp+=30;
  say("Hạ gục hải tặc! +25 vàng, +30 EXP");
  while(player.exp>=player.lv*100){
   player.exp-=player.lv*100;player.lv++;
   player.maxHp+=15;player.hp=player.maxHp;
   say("LÊN CẤP "+player.lv+"! Máu được hồi đầy!");
  }
  if(defeated>=3)quest.textContent="Hoàn thành! Hãy tiếp tục khám phá!";
  if(enemies.filter(e=>e.alive).length<3)
   spawnEnemy(100+Math.random()*1100,100+Math.random()*800);
 }
}
document.getElementById("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack()});

document.getElementById("skill").addEventListener("pointerdown",e=>{
 e.preventDefault();
 let hit=0;
 enemies.forEach(enemy=>{
  if(enemy.alive&&Math.hypot(enemy.x-player.x,enemy.y-player.y)<125){
   damage(enemy,40);hit++;
  }
 });
 player.hit=.3;
 say(hit?"🔥 HỎA TÂM! Trúng "+hit+" mục tiêu!":"🔥 HỎA TÂM! Không trúng kẻ địch nào!");
});

document.getElementById("dash").addEventListener("pointerdown",e=>{
 e.preventDefault();
 player.x=Math.max(35,Math.min(worldW-35,player.x+player.dirX*115));
 player.y=Math.max(35,Math.min(worldH-35,player.y+player.dirY*115));
});

function update(dt){
 movePlayer(dt);
 player.hit=Math.max(0,player.hit-dt);
 enemies.forEach(e=>{
  if(!e.alive)return;
  e.hit=Math.max(0,e.hit-dt);
  const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
  if(d>28){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}
  if(d<32){
   e.cool=(e.cool||0)-dt;
   if(e.cool<=0){
    player.hp-=8;e.cool=1;
    if(player.hp<=0){
     player.hp=player.maxHp;player.x=650;player.y=500;
     say("Bạn đã bị đánh bại! Đã hồi sinh.");
    }
   }
  }
 });
 cameraX=Math.max(0,Math.min(worldW-W,player.x-W/2));
 cameraY=Math.max(0,Math.min(worldH-H,player.y-H/2));
 stats.innerHTML="Lv. "+player.lv+"<br>❤️ "+Math.ceil(player.hp)+"/"+player.maxHp+"<br>⭐ EXP "+player.exp+"/"+player.lv*100+"<br>🪙 "+player.gold;
 if(performance.now()-lastMessage>3500)message.style.display="none";
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(-cameraX,-cameraY);
 // Đại dương
 ctx.fillStyle="#1685a4";ctx.fillRect(0,0,worldW,worldH);
 // Sóng biển
 ctx.strokeStyle="#53c4d1";ctx.globalAlpha=.4;ctx.lineWidth=2;
 for(let y=25;y<worldH;y+=65)for(let x=20;x<worldW;x+=95){
  ctx.beginPath();ctx.arc(x,y,12,Math.PI*.1,Math.PI*.9);ctx.stroke();
 }
 ctx.globalAlpha=1;
 // Đảo
 ctx.fillStyle="#b9a66b";ctx.beginPath();ctx.ellipse(650,500,440,350,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#53a95b";ctx.beginPath();ctx.ellipse(650,490,415,326,0,0,Math.PI*2);ctx.fill();
 // Đường đi
 ctx.strokeStyle="#dfc88a";ctx.lineWidth=30;ctx.beginPath();ctx.moveTo(360,600);ctx.quadraticCurveTo(620,430,880,520);ctx.stroke();
 // Nhà
 for(const [x,y] of [[500,350],[770,400],[600,650],[820,610]]){
  ctx.fillStyle="#9d6239";ctx.fillRect(x-25,y-20,50,38);
  ctx.fillStyle="#613927";ctx.beginPath();ctx.moveTo(x-34,y-20);ctx.lineTo(x,y-48);ctx.lineTo(x+34,y-20);ctx.fill();
  ctx.fillStyle="#51331f";ctx.fillRect(x-6,y,12,18);
 }
 // Cây
 for(const [x,y] of [[400,420],[440,530],[750,300],[900,450],[720,700],[490,700],[860,650],[350,540],[940,560]]){
  ctx.fillStyle="#714a29";ctx.fillRect(x-4,y,8,19);
  ctx.fillStyle="#17683f";ctx.beginPath();ctx.arc(x,y,19,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#28844a";ctx.beginPath();ctx.arc(x-6,y-7,12,0,Math.PI*2);ctx.fill();
 }
 // Bến tàu
 ctx.fillStyle="#81502d";ctx.fillRect(610,800,100,22);
 ctx.fillRect(620,822,8,40);ctx.fillRect(690,822,8,40);
 ctx.fillStyle="#e8d5a0";ctx.font="bold 15px Arial";ctx.fillText("BẾN TÀU",625,790);
 // Kẻ địch
 enemies.forEach(e=>{
  if(!e.alive)return;
  ctx.fillStyle="#501f27";ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=e.hit?"#ffffff":"#d84b4b";ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="white";ctx.fillRect(e.x-17,e.y-24,34,5);
  ctx.fillStyle="#54df69";ctx.fillRect(e.x-17,e.y-24,34*Math.max(0,e.hp/e.maxHp),5);
  ctx.fillStyle="white";ctx.font="10px Arial";ctx.fillText("Hải tặc",e.x-17,e.y-29);
 });
 // Nhân vật
 ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(player.x,player.y+13,17,7,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=player.hit?"#fff4a5":"#ffe0a1";ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#1d385e";ctx.fillRect(player.x-12,player.y+3,24,13);
 ctx.fillStyle="#a82f32";ctx.beginPath();ctx.moveTo(player.x-13,player.y-9);ctx.lineTo(player.x+13,player.y-9);ctx.lineTo(player.x,player.y-19);ctx.fill();
 ctx.fillStyle="white";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText("Bạn",player.x,player.y-26);ctx.textAlign="left";
 ctx.restore();
}
let previous=performance.now();
function loop(now){
 const dt=Math.min(.04,(now-previous)/1000);previous=now;
 update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
  </html>
